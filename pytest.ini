[pytest]
pythonpath = .
testpaths = tests
markers =
    slow: real-dataset evaluation that takes more than a few seconds; runs only with KWAN_RUN_SLOW=1
    network: needs internet access (downloads a dataset or calls a service)
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient`
