# Learner datasets Kwan is validated on (PRD Section 5.2, Appendix B.1).
#
# Every dataset downloads without an account. Raw rows are never committed: `make data`
# (scripts/download_data.sh) fetches them into raw/, which git ignores.
#
#   name                  what the dataset is
#   url                   where it is downloaded from
#   size                  size of the download
#   licence               the terms it is shared under
#   citation              what to cite when results on it are published
#   role                  what Kwan uses it for
#   commercial_params_ok  true when parameters fitted on it may ship in a Kwan bundle.
#                         false means evaluation only: fitted values never leave build/.
#   raw                   where it lives under raw/ after `make data`
#   files                 the files the loader reads, relative to `raw`
#   results_keys          the blocks it owns in data/eval_results.json
#   fetch                 how scripts/download_data.sh gets it
#
# kwan/data/registry.py carries `licence` and `commercial_params_ok` again as a small Python
# table, so the bundle builder can check them without PyYAML. A test keeps the two in step.

assistments_2009:
  name: ASSISTments 2009 skill-builder (corrected)
  url: http://base.ustc.edu.cn/data/ASSISTment/2009_skill_builder_data_corrected.zip
  size: 9 MB
  licence: research use; cite Feng, Heffernan & Koedinger (2009)
  citation: >-
    Feng, M., Heffernan, N. T. & Koedinger, K. R. (2009). Addressing the assessment challenge with an
    online system that tutors as it assesses. User Modeling and User-Adapted Interaction, 19(3), 243-266.
  role: [kt_eval]
  commercial_params_ok: true
  raw: skill_builder_data_corrected.csv
  files: [skill_builder_data_corrected.csv]
  results_keys: [assistments_2009]
  fetch: {method: zip, archive: a09.zip}

eedi_2020:
  name: Eedi NeurIPS 2020 Education Challenge
  url: https://dqanonymousdata.blob.core.windows.net/neurips-public/data.zip
  size: 657 MB
  licence: research use; cite Wang et al. (2020) arXiv:2007.12061
  citation: >-
    Wang, Z., Lamb, A., Saveliev, E., Cameron, P., Zaykov, Y., Hernandez-Lobato, J. M., Turner, R. E.,
    Baraniuk, R. G., Barton, C., Peyton Jones, S., Woodhead, S. & Zhang, C. (2020). Instructions and guide
    for Diagnostic Questions: the NeurIPS 2020 Education Challenge. arXiv:2007.12061.
  role: [kt_eval, item_bank]
  commercial_params_ok: true
  raw: eedi/data
  subsets: {task34: train_data/train_task_3_4.csv, task12: train_data/train_task_1_2.csv}
  files:
    - train_data/train_task_3_4.csv
    - metadata/answer_metadata_task_3_4.csv
    - metadata/question_metadata_task_3_4.csv
    - train_data/train_task_1_2.csv
    - metadata/answer_metadata_task_1_2.csv
    - metadata/question_metadata_task_1_2.csv
    - metadata/subject_metadata.csv
  results_keys: [eedi_2020_task34, eedi_2020_task12]
  fetch: {method: zip, archive: eedi.zip}

ammore_2024:
