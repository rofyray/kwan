line-length = 120
target-version = "py311"
src = ["src", "."]
extend-exclude = ["build", "dist", "raw", "site", "kwan_v2_kit", ".venv-kt", "*.md"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B905", # zip() without strict=: the code relies on truncation in a few places
]

[lint.per-file-ignores]
"tests/*" = ["E501", "E731", "E741", "B023"]
"src/kwan/context/bank.py" = ["E501"] # practice settings are prose, one per line

[lint.isort]
known-first-party = ["kwan"]

[format]
quote-style = "double"
