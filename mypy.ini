[mypy]
python_version = 3.11
mypy_path = src
# Strict typing is required for the learner models, the recommender, the bundle and the public facade
# (PRD Section 8). Modules they import are followed, not reported.
files = src/kwan/learner, src/kwan/recommend, src/kwan/bundle.py, src/kwan/kwan.py
strict = True
follow_imports = silent
warn_unused_configs = True

[mypy-networkx.*]
ignore_missing_imports = True
