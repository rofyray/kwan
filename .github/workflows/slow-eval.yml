name: slow evaluation

# Once a week: fetch every learner dataset in data/datasets.yaml, run every evaluation and the slow
# tests, and open a pull request when data/eval_results.json changes. Nothing is pushed to main.
#
# Raw datasets are never committed: the only file this workflow ever stages is data/eval_results.json.
# The pull request step needs the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings, Actions, General).

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: slow-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      RESULTS: data/eval_results.json
      BRANCH: auto/eval-results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Free disk space (the datasets need about 11 GB, archives included)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Tools that can unpack the Junyi .rar
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools unar

      - run: pip install -e ".[dev,eval]"

      # Only the downloaded archives are cached (about 3 GB); they are unpacked again on every run.
      # Junyi (.rar) and XES3G5M (Google Drive) are fragile downloads, so a cached copy matters most for them.
      - name: Cache the downloaded datasets
        uses: actions/cache@v4
        with:
          path: |
            raw/a09.zip
            raw/eedi.zip
            raw/2012-2013-data-with-predictions-4-final.zip
            raw/2015_100_skill_builders_main_problems.zip
            raw/anonymized_full_release_competition_dataset.zip
            raw/junyi.rar
            raw/xes3g5m/XES3G5M.tar.gz
            raw/ammore
          key: kwan-datasets-v1-${{ hashFiles('data/datasets.yaml') }}
          restore-keys: |
            kwan-datasets-v1-

      # Fragile datasets that cannot be fetched are skipped with a clear message, never an error.
      - name: Fetch every learner dataset
        run: bash scripts/download_data.sh learner

      # Datasets that are missing get a "skipped" block only if the file has no numbers for them yet.
      - name: Run every evaluation
        run: kwan eval all --raw raw --out data/eval_results.json

      - name: Slow tests
        env:
          KWAN_RUN_SLOW: "1"
        run: pytest -q -m slow

      - name: Open a pull request when the results changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- "$RESULTS"; then
            echo "eval_results.json did not change: nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$RESULTS"
          git commit -m "Weekly evaluation: update eval_results.json"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "Weekly evaluation: results changed" \
              --body "The weekly run of every learner-model evaluation gave numbers that differ from data/eval_results.json. Review the diff before merging: a change means a dataset, a loader or the model changed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "A pull request for $BRANCH is already open: it now shows the new numbers."
          fi
