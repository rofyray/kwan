# Release Kwan (PRD Phase 12.2). On a tag v<version>: check the tag matches the package version, run the
# fast tests, build the wheel and sdist, publish to PyPI with trusted publishing (no API token: the `pypi`
# environment must be registered as a trusted publisher on pypi.org), create the GitHub release with the
# maths bundle and eval_results.json attached, then dispatch space-deploy.yml.
#
# A release created with GITHUB_TOKEN does not fire the `release` event of other workflows, which is why the
# last job dispatches the Space deploy itself.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra api --extra demo --extra eval --extra curriculum
      - name: The tag must match the package version
        run: |
          version="$(uv run python -c 'import kwan; print(kwan.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match kwan.__version__ $version" >&2
            exit 1
          fi
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q -m "not slow"

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build --sdist --wheel --out-dir dist
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kwan/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Collect the release files
        run: |
          mkdir -p release
          cp dist/* release/
          cp src/kwan/bundles/kwan-bundle.math.json release/
          cp data/eval_results.json release/
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  deploy-space:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch space-deploy.yml for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run space-deploy.yml --ref "$GITHUB_REF_NAME"
